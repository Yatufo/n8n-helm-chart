suite: main configmap
templates:
  - templates/configmap.yaml
tests:
  - it: does not render when main.config is empty
    set:
      main:
        config: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: renders when main.config is set
    set:
      main:
        config:
          n8n:
            port: 5678
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-n8n-app-config

  - it: renders nested config values as environment variables
    set:
      main:
        config:
          n8n:
            port: 5678
            host: 0.0.0.0
          db:
            type: postgresdb
            postgresdb:
              host: postgres
    asserts:
      - exists:
          path: data.N8N_PORT
      - equal:
          path: data.N8N_PORT
          value: "5678"
      - exists:
          path: data.N8N_HOST
      - exists:
          path: data.DB_TYPE
      - exists:
          path: data.DB_POSTGRESDB_HOST

