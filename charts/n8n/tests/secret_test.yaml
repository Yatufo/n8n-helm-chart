suite: main secret
templates:
  - templates/secret.yaml
tests:
  - it: does not render when main.secret is empty
    set:
      main:
        secret: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: renders when main.secret is set
    set:
      main:
        secret:
          n8n:
            encryption_key: my-secret-key
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-n8n-app-secret
      - equal:
          path: type
          value: Opaque

  - it: renders secret values as base64 encoded
    set:
      main:
        secret:
          n8n:
            encryption_key: my-secret-key
    asserts:
      - exists:
          path: data.N8N_ENCRYPTION_KEY

